# =============================================================================
# Aturan bersama untuk server HTTP (default.conf) dan HTTPS (https.conf).
# Keduanya memanggil file ini dengan "include", jadi aturan cukup ditulis sekali.
# File ini ada di subfolder snippets/, sehingga tidak ikut dimuat otomatis oleh
# "include /etc/nginx/conf.d/*.conf" di nginx.conf.
# =============================================================================

root  /usr/share/nginx/html;
index index.html;
charset utf-8;

# DNS internal Docker selalu berada di 127.0.0.11 (cek: cat /etc/resolv.conf di
# container mana pun). Dengan "resolver" + variabel, nginx menanyakan alamat "api"
# setiap kali dibutuhkan (cache 10 detik), bukan hanya sekali saat start.
# Akibatnya nginx tetap bisa start walau api sedang mati, dan ikut berpindah bila
# IP container api berubah (misalnya setelah api dibuat ulang atau di-scale).
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://api:3000;

# Frontend statis (web/html di repo).
location / {
    try_files $uri $uri/ =404;
}

# Reverse proxy: semua path /api/... diteruskan ke service api port 3000.
location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    30s;
}

# Data mahasiswa untuk footer halaman (file student.json di root repo).
location = /student.json {
    root /srv/lab;
    add_header Cache-Control "no-store" always;
}

# Dipakai healthcheck Docker untuk service web (tidak dicatat di access log).
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
