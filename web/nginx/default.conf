# =============================================================================
# nginx untuk Net Web Lab: server HTTP.
# Folder web/nginx di repo di-mount ke /etc/nginx/conf.d di container web
# (read-only), sehingga semua file *.conf di folder ini dimuat nginx.
#
# Setelah mengubah konfigurasi:
#   docker compose exec web nginx -t          cek sintaks
#   docker compose exec web nginx -s reload   muat ulang tanpa mematikan container
# =============================================================================

server {
    listen 80 default_server;
    server_name localhost web;

    include /etc/nginx/conf.d/snippets/lab-locations.conf;
}
